<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛管理（個体識別番号基準）</title>
<style>
  :root{color-scheme:light;--bg:#f6f5f1;--card:#fff;--ink:#222;--sub:#777;--line:#ddd;--acc:#2f6f4e;}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:17px;background:var(--bg);color:var(--ink)}
  header{background:var(--acc);color:#fff;padding:12px 16px;font-weight:bold;position:sticky;top:0;z-index:5}
  nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:44px;z-index:4}
  nav button{flex:1;padding:12px 0;border:none;background:none;font-size:15px;color:var(--sub)}
  nav button.on{color:var(--acc);border-bottom:3px solid var(--acc);font-weight:bold}
  #alBadge{color:#b33a3a;font-weight:bold}
  main{padding:12px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .card.female{background:#fdf1f5;border:1px solid #f0c9d6}
  .card.male{background:#eef4fb;border:1px solid #c5d8ee}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .row>input,.row>select{flex:1;min-width:0}
  input,select{color:#222;color-scheme:light;-webkit-text-fill-color:#222;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
  input:disabled,select:disabled{background:#eee}
  .lbl{width:96px;font-size:15px;color:var(--sub);flex-shrink:0}
  .tag{font-size:24px;font-weight:bold;letter-spacing:1px}
  button.btn{font-size:18px;padding:14px;border:none;border-radius:10px;background:var(--acc);color:#fff;width:100%}
  button.sub{background:#e7ece8;color:var(--ink)}
  button.danger{background:#b33a3a}
  .row>button.btn{width:auto;flex-shrink:0;padding:12px 16px;white-space:nowrap}
  .row>input{height:48px}
  button.xbtn{width:auto;padding:2px 10px;font-size:16px;line-height:1.4;border:none;border-radius:8px;background:#e7ece8;color:#333;flex-shrink:0}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .grid button{padding:14px 4px;font-size:16px;border:1px solid var(--line);border-radius:10px;background:#fff}
  .grid button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .grid button:disabled{background:#ececec;color:#aaa;border-color:#e0e0e0}
  .muted{color:var(--sub);font-size:14px}
  .badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;margin:2px 4px 2px 0}
  .b-ok{background:#dcefe3;color:#1f5a3c}
  .b-warn{background:#fbeccc;color:#7a4f00}
  .b-bad{background:#f4dede;color:#9b2c2c}
  .b-info{background:#dde9f6;color:#2a5b8c}
  .b-mute{background:#eee;color:#555}
  .b-calm{background:#e6f4ec;color:#2f6b4f}
  .stg{display:flex;gap:3px;margin:6px 0}
  .sg{flex:1;text-align:center;font-size:12px;padding:4px 0;border-radius:6px;background:#eee;color:#777}
  .sg.done{background:#dcefe3;color:#1f5a3c}
  .sg.warn{background:#fbeccc;color:#7a4f00;font-weight:bold}
  .sg.cur{background:#2a5b8c;color:#fff;font-weight:bold}
  .sg.calm{background:#6fae8c;color:#fff;font-weight:bold}
  .tbox{border:3px solid #c0392b;background:#fdecea;color:#7a1f1f;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:15px;font-weight:bold;line-height:1.6}
  .htoday{border:3px solid #ea580c;background:#ffedd5;color:#7c2d12;border-radius:8px;padding:8px 10px;margin:6px 0;font-weight:bold;font-size:16px}
  .hbox{border:3px solid #b91c1c;background:#fde8e8;color:#7f1d1d;border-radius:8px;padding:6px 10px;margin:6px 0;font-weight:bold}
  .obox{border:3px solid #d97706;background:#fff4e0;color:#7a4300;border-radius:8px;padding:8px 10px;margin:8px 0;font-size:15px;font-weight:bold;line-height:1.6}
  .tiles{display:flex;gap:8px;margin-bottom:12px}
  .tile{flex:1;border-radius:10px;padding:8px 4px;text-align:center}
  .t-warn{background:#fbeccc;color:#7a4f00}
  .t-info{background:#dde9f6;color:#2a5b8c}
  .t-calm{background:#e6f4ec;color:#2f6b4f}
  .item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .item:last-child{border-bottom:none}
  .ev{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px;gap:8px}
  .chips{overflow-x:auto;white-space:nowrap;margin-bottom:8px}
  .chip{display:inline-block;padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;margin-right:6px;font-size:14px}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .lnk{color:var(--acc);text-decoration:underline;cursor:pointer}
  .hidden{display:none !important}
  .msg{color:#b33a3a;margin:6px 0}
  .btnsmall{width:auto;padding:8px 14px;font-size:15px}
  h3{margin:6px 0 10px;font-size:17px}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#333;color:#fff;padding:12px 18px;border-radius:10px;font-size:15px;z-index:10;max-width:90%}
  .pedwrap{overflow-x:auto;padding:6px 2px 12px;-webkit-overflow-scrolling:touch}
  .ptree{display:flex;align-items:center}
  .pkids{display:flex;flex-direction:column;justify-content:space-around;margin-left:14px;padding-left:14px;border-left:2px solid #94a3b8}
  .pkid{position:relative;padding:5px 0}
  .pkid::before{content:'';position:absolute;left:-14px;top:50%;width:14px;border-top:2px solid #94a3b8}
  .pbox{min-width:124px;border:1.5px solid #94a3b8;border-radius:8px;padding:5px 8px;font-size:13px;background:#fff;color:#222}
  .pbox.cow{cursor:pointer;border-color:#111827;border-width:2px}
  .pbox.bull{background:#f8fafc}
  .pbox.unk{color:#8a8a8a;border-style:dashed;background:transparent;font-size:12px}
  .pbox .plab{display:block;font-size:11px;color:#555}
  .pbox small{display:block;color:#666;font-size:11px}
  .pbox .badge{margin-top:3px}
</style>
</head>
<body>
<header>牛管理（個体識別番号基準）</header>
<div id="roleBar" style="display:flex;gap:6px;padding:8px 10px;background:#fff;border-bottom:1px solid var(--line)">
  <button data-act="setRole" data-arg="子牛係" class="chip" style="flex:1;font-size:15px;padding:8px 0">子牛係</button>
  <button data-act="setRole" data-arg="繁殖係" class="chip" style="flex:1;font-size:15px;padding:8px 0">繁殖係</button>
  <button data-act="setRole" data-arg="全体" class="chip" style="flex:1;font-size:15px;padding:8px 0">全体</button>
</div>
<nav>
  <button data-act="show" data-arg="input" class="on">入力</button>
  <button data-act="show" data-arg="alerts">アラート<span id="alBadge"></span></button>
  <button data-act="allList" data-arg="list">個体一覧</button>
  <button data-act="breedTab" data-arg="和牛" data-breed="和牛" data-hide-for="子牛係" style="font-size:13px">和牛</button>
  <button data-act="breedTab" data-arg="ホルスタイン" data-breed="ホルスタイン" data-hide-for="子牛係" style="font-size:12px">ホルスタイン</button>
  <button data-act="breedTab" data-arg="哺乳中" data-breed="哺乳中" data-hide-for="繁殖係" style="font-size:12px">哺乳</button>
  <button data-act="breedTab" data-arg="育成" data-breed="育成" data-hide-for="繁殖係" style="font-size:12px">育成</button>
  <button data-act="newReg" data-arg="reg">登録</button>
  <button data-act="show" data-arg="set">設定</button>
</nav>
<main>

<section id="v-input">
  <div class="card">
    <div class="row">
      <input id="tagIn" inputmode="numeric" maxlength="10" placeholder="簡易番号（4桁）または識別番号" onkeydown="if(event.key==='Enter')openTag()">
      <button class="btn" style="width:auto;padding:12px 18px" onclick="openTag()">開く</button>
    </div>
    <div id="tagMsg"></div>
  </div>
  <div id="panel" class="hidden">
    <div class="card" id="cowHead"></div>
    <div class="card">
      <h3>イベントを記録</h3>
      <div id="typeGrid"></div>
      <div id="entryForm" class="hidden" style="margin-top:12px"></div>
    </div>
    <div class="card"><h3>血統・系譜</h3><div id="lineage"></div></div>
    <div class="card"><h3>履歴（新しい順）</h3><div id="history"></div></div>
  </div>
</section>

<section id="v-alerts" class="hidden">
  <div class="card"><h3>対応が必要な項目（期限が近い順）</h3><div class="chips" id="breedChipsA"></div><div id="alertBox"></div></div>
</section>

<section id="v-list" class="hidden">
  <div class="card">
    <input id="search" placeholder="簡易番号（4桁）または識別番号で検索" oninput="renderList()" style="margin-bottom:10px">
    <div class="chips" id="breedChips"></div>
    <div class="chips" id="chips"></div>
    <div id="listBox"></div>
  </div>
</section>

<section id="v-reg" class="hidden">
  <div class="card" id="regBox"></div>
</section>

<section id="v-set" class="hidden">
  <div id="setBox"></div>
</section>

</main>
<div id="toast" class="hidden"></div>

<script>
const KEY = 'cattle-app-v4';
const DAY = 864e5;
const BREEDS = ['和牛','ホルスタイン','F1','その他'];
const SEX = ['雌','雄'];
const ASSIST = ['自然分娩','介助','難産','死産'];
const RESULT = ['陽性','陰性','要再検'];
const MASTER_DEF = {
  sire:    {label:'種牛', list:[]},
  barn:    {label:'牛舎・移動先', list:[]},
  disease: {label:'病名・症状', list:[]},
  vaccine: {label:'ワクチン', list:[]},
  drug:    {label:'注射薬', list:[]},
  embryo:  {label:'胚の種類', list:[]},
  cause:   {label:'死亡原因', list:[]},
  src:     {label:'導入元', list:['大和谷','中村','小嶋','小木','溝井','置戸町外']},
};
const LINES = ['田尻','藤良','気高'];
const LINE_COLOR = {'田尻':'#c0392b','藤良':'#2e8b57','気高':'#2f6fb0'};
const FEMALE_ONLY = ['estrus','ai','preg','calving'];
const REPRO_TYPES = ['estrus','ai','preg','calving'];
const HEALTH_TYPES = ['sick','vacc','inj','cured','hyg'];
const FATTEN_M = 30; // 自家肥育の肉用出荷月齢
const TYPES = {
  estrus:  {label:'発情', f:[{k:'method', t:'fixed', o:['通常受精','受精卵移植'], label:'授精の方法'}]},
  ai:      {label:'授精', f:[{k:'method', t:'fixed', o:['人工授精','受精卵移植'], label:'方法'}, {k:'sire', t:'master', m:'sire', label:'種牛'}, {k:'embryo', t:'master', m:'embryo', label:'胚の種類', onlyIf:{k:'method', v:'受精卵移植'}}]},
  preg:    {label:'妊娠鑑定', f:[{k:'result', t:'fixed', o:RESULT, label:'結果'}]},
  calving: {label:'分娩', f:[
              {k:'assist', t:'fixed', o:ASSIST, label:'分娩の状態'},
              {k:'count', t:'fixed', o:['1頭','双子'], label:'生まれた頭数', live:true},
              {k:'c1id', t:'id', label:'子1の識別番号', live:true},
              {k:'c1sex', t:'fixed', o:SEX, label:'子1の性別', live:true},
              {k:'c1breed', t:'fixed', o:BREEDS, label:'子1の品種', live:true},
              {k:'c1name', t:'text', label:'子1の名前（和牛のみ・任意）', optional:true, onlyIf:{k:'c1breed', v:'和牛'}, live:true},
              {k:'c2id', t:'id', label:'子2の識別番号', twin:true, live:true},
              {k:'c2sex', t:'fixed', o:SEX, label:'子2の性別', twin:true, live:true},
              {k:'c2breed', t:'fixed', o:BREEDS, label:'子2の品種', twin:true, live:true},
              {k:'c2name', t:'text', label:'子2の名前（和牛のみ・任意）', twin:true, optional:true, onlyIf:{k:'c2breed', v:'和牛'}, live:true}]},
  move:    {label:'移動', f:[{k:'barn', t:'master', m:'barn', label:'移動先'}]},
  weight:  {label:'体重', f:[{k:'kg', t:'num', label:'体重(kg)'}]},
  wean:    {label:'離乳', f:[]},
  sick:    {label:'診療', f:[{k:'disease', t:'multi', m:'disease', label:'病名・症状（複数選べます）'}]},
  vacc:    {label:'ワクチン', f:[{k:'vaccine', t:'master', m:'vaccine', label:'ワクチン'}]},
  inj:     {label:'注射', f:[{k:'drug', t:'master', m:'drug', label:'注射薬'}]},
  ship:    {label:'出荷', f:[{k:'seri', t:'num', label:'セリ番号'}, {k:'weight', t:'num', label:'体重(kg)', onlyBreed:'和牛'}, {k:'price', t:'num', label:'価格(千円)'}]},
  retain:  {label:'自家保留', f:[]},
  dead:    {label:'死亡', f:[{k:'cause', t:'master', m:'cause', label:'死亡原因'}]},
  cured:   {label:'治癒', f:[]},
  hyg:     {label:'衛生管理', f:[]},
  measure: {label:'体高・胸囲', f:[{k:'height', t:'num', label:'体高(cm)'}, {k:'girth', t:'num', label:'胸囲(cm)', optional:true}, {k:'kg', t:'num', label:'体重(kg・測った時だけ)', optional:true}]},
  intro:   {label:'導入', f:[{k:'src', t:'master', m:'src', label:'導入元'}, {k:'price', t:'num', label:'買取料金(千円)'}]},
};
const FILTERS = ['全て','妊娠中','出産直前','出産予定超過','授精済','分娩後','空胎','繁殖待ち','哺乳中','離乳時期','離乳済','育成中','出荷適期','出荷済','死亡'];
const ID_RE = /^\d{10}$/;
function shortId(t){ return String(t).slice(5, 9); }  // 1234567890 → 6789
// 検索：10桁は完全一致、4桁は簡易番号（下4桁）一致、それ以外は部分一致
function findTags(q){
  q = (q || '').trim(); if(!q) return [];
  const all = Object.keys(db.animals);
  if(ID_RE.test(q)) return all.includes(q) ? [q] : [];
  if(/^\d{4}$/.test(q)) return all.filter(t => shortId(t) === q).sort(natSort);
  return all.filter(t => t.includes(q) || (db.animals[t].name && db.animals[t].name.includes(q))).sort(natSort);
}

/* ---------- データ ---------- */
function load(){
  let d = {};
  try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {}
  return build(d);
}
function migrateEv(e){
  if(e.type === 'sale') return {...e, type:'ship'};
  if(e.type === 'et') return {...e, type:'ai', data:{...(e.data || {}), method:'受精卵移植'}};
  return e;
}
function build(d){
  const masters = {};
  Object.keys(MASTER_DEF).forEach(m => masters[m] = [...MASTER_DEF[m].list]);
  Object.keys(d.masters || {}).forEach(m => masters[m] = d.masters[m]);
  const settings = {
    gest:   {'和牛':285,'ホルスタイン':280,'F1':283,'その他':283},
    weanM:  {'和牛':3,'ホルスタイン':2,'F1':2,'その他':2},
    shipM:  {'和牛':10,'ホルスタイン':10,'F1':10,'その他':10},
    warnDays: 14,
    withdraw: {},
    reproM: {'和牛':13,'ホルスタイン':13,'F1':13,'その他':13},
    ...(d.settings || {})
  };
  // 繁殖供用の月齢を13ヶ月に統一（保存済みの古い12ヶ月の設定を一度だけ置き換える）
  if(!settings.reproV2){ settings.reproM = {'和牛':13,'ホルスタイン':13,'F1':13,'その他':13}; settings.reproV2 = true; }
  return {animals: d.animals || {}, events: (d.events || []).map(migrateEv), masters, settings, sireLine: d.sireLine || {}, sirePed: d.sirePed || {}, updatedAt: d.updatedAt || 0};
}
let db = load();
function save(){ db.updatedAt = Date.now(); persistLocal(); lsSet('cattle-dirty','1'); updateBadge(); scheduleSync(); }

/* ---------- 共通 ---------- */
let cur = null, editing = null, selType = null, filterSt = '全て', showOut = false, breedF = '全て';
// 役割（子牛係・繁殖係・全体）。役割ごとに見える画面と入力項目を絞る
let role = '全体', curView = 'input', rearF = '全て', sortMode = 'natural', hygAsk = null;
const ROLE_TYPES = {'子牛係':['sick','vacc','inj','cured','wean','weight','move','measure'], '繁殖係':['estrus','ai','preg','calving','measure']};
const ROLE_DEFAULT = {'子牛係':'哺乳中', '繁殖係':'和牛', '全体':'全て'};
function roleAllows(k){ return role === '全体' || !ROLE_TYPES[role] || ROLE_TYPES[role].includes(k); }
function roleTag(t){
  // 生年月日が未入力の牛は、どの係からも見えるように両方に出す
  if(ageM((db.animals[t] || {}).birth) === null) return true;
  if(role === '子牛係') return isCalfRole(t);
  if(role === '繁殖係') return isBreedingCow(t);
  return true;
}
function saveView(){
  try{ localStorage.setItem('cattle-lastview', JSON.stringify({view: curView, breedF, filterSt, role, rearF, sortMode})); }catch(e){}
}
function loadView(){
  try{
    const v = JSON.parse(localStorage.getItem('cattle-lastview') || 'null');
    if(v){ role = ROLE_TYPES[v.role] || v.role === '全体' ? v.role : '全体'; breedF = v.breedF || '全て'; filterSt = v.filterSt || '全て'; rearF = v.rearF || '全て'; sortMode = v.sortMode || 'natural'; return v.view || 'input'; }
  }catch(e){}
  return 'input';
}
function setRole(r){
  role = r; breedF = ROLE_DEFAULT[r] || '全て'; filterSt = '全て';
  if(selType && !allowedType(cur, selType)){ selType = null; }
  show('list');
}
// 哺乳中：離乳前の子牛（品種を問わない）
function isNursing(t){
  const a = db.animals[t] || {}, age = ageM(a.birth);
  return age !== null && age < (db.settings.weanM[a.breed] ?? 2) && !last(t,'wean') && !isOut(t);
}
// 哺乳の進み具合バー：通常哺乳 → 減乳期間① → 減乳期間②（離乳の2週間前から1週間ずつ）→ 離乳
function weanBar(t){
  const a = db.animals[t] || {};
  if(!a.birth) return '';
  const wm = db.settings.weanM[a.breed] ?? 2;
  const bd = dn(a.birth), wd = dn(addMonths(a.birth, wm)), rd = wd - 14, md = wd - 7, T = todayN();
  const span = Math.max(1, wd - bd);
  const pct = d => Math.max(0, Math.min(100, (d - bd) / span * 100));
  const pos = pct(T);
  let phase, msg;
  if(T < rd){ phase = '通常哺乳'; msg = `減乳期間①まであと${rd - T}日`; }
  else if(T < md){ phase = '減乳期間①'; msg = `減乳期間②まであと${md - T}日`; }
  else if(T < wd){ phase = '減乳期間②'; msg = `離乳まであと${wd - T}日`; }
  else { phase = '離乳'; msg = '離乳日です'; }
  const w1 = pct(rd), w2 = pct(md) - pct(rd), w3 = 100 - pct(md);
  return `<div style="margin:8px 0 4px">
    <div style="position:relative;height:22px;border-radius:11px;overflow:visible;display:flex">
      <div style="width:${w1}%;background:#dde9f6;border-radius:11px 0 0 11px"></div>
      <div style="width:${w2}%;background:#fde3b0"></div>
      <div style="width:${w3}%;background:#f5b25c;border-radius:0 11px 11px 0"></div>
      <div style="position:absolute;left:calc(${pos}% - 8px);top:3px;width:16px;height:16px;border-radius:50%;background:#111;border:2px solid #fff;box-shadow:0 0 0 1px #888"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#555;margin-top:3px">
      <span>0日</span><span style="font-weight:bold;color:#111">${T - bd}日齢・${phase}　${msg}</span><span>離乳${wd - bd}日</span>
    </div></div>`;
}
// 治療中：最新の診療の後に治癒が記録されていなければ治療中
// 治療の状態：治療中 → 治癒の記録から7日は経過観察 → 終了（表示しない）
function treatState(t){
  const sk = last(t,'sick'); if(!sk) return null;
  const cu = last(t,'cured');

function hasRepro(tag){ return evOf(tag).some(e => REPRO_TYPES.includes(e.type)); }
function repro(tag){
  const a = db.animals[tag] || {};

  const calv = evType(tag,'calving'), ais = evType(tag,'ai'), pregs = evType(tag,'preg');
  const lc = calv[0], la = ais[0], lp = pregs[0];
  const r = {count: calv.length, lastCalv: lc, lastAi: la, preg: lp, pregnant: false, due: null, dueApprox: false, state: null, base: null};
  if(lp && lp.data.result === '陽性' && (!lc || lc.date < lp.date)){
    r.pregnant = true;
    const base = ais.find(e => e.date <= lp.date);
    r.base = base || null;
    if(base) r.due = addDays(base.date, gest);
    else { r.due = addDays(lp.date, gest - 60); r.dueApprox = true; }
  }
  const sinceCalv = lc ? todayN() - dn(lc.date) : null;
  if(r.pregnant) r.state = '妊娠中';
  else if(la && (!lp || la.date > lp.date) && (!lc || la.date > lc.date)) r.state = '授精済';
  else if(lc && sinceCalv < 60) r.state = '分娩後';
  else if(lp && lp.data.result === '陰性' && (!lc || lp.date > lc.date)) r.state = '空胎';

}
function isOut(tag){ return !!(last(tag,'dead') || last(tag,'ship')); }
function statuses(tag){
  const a = db.animals[tag]; if(!a) return [];

  if(last(tag,'dead')) return [{t:'死亡', c:'bad'}];
  if(a.sex === '雄' && last(tag,'retain')) return [{t:'自家肥育', c:'info'}];
  if(last(tag,'ship')) return [{t:'出荷済', c:'mute'}];
  if(a.sex === '雌' && hasRepro(tag)){
    const r = repro(tag), out = [];
    if(r.count) out.push({t:'産次'+r.count, c:'mute'});
    if(r.pregnant){
      const left = dn(r.due) - todayN();
      out.push({t:'妊娠中', c:'calm'});
      if(left < 0) out.push({t:'出産予定超過', c:'bad'});
      else if(left <= S.warnDays) out.push({t:'出産直前', c:'warn'});
    } else if(r.state === '授精済' && r.lastAi){
      out.push({t:`鑑定待ち（授精から${todayN() - dn(r.lastAi.date)}日）`, c:'info'});
    } else if(r.state){
      out.push({t:r.state, c: (r.state==='空胎'||r.state==='繁殖待ち') ? 'warn' : 'info'});
    }
    return out;
  }
  const out = [];
  const age = ageM(a.birth);
  if(last(tag,'retain')) out.push({t:'自家保留', c:'info'});
  if(age !== null){
    const weanM = S.weanM[a.breed] ?? 2, shipM = S.shipM[a.breed] ?? 10;
    const wean = last(tag,'wean');
    if(wean) out.push({t:'離乳済', c:'mute'});

// 生後200日以内の子牛だけ対象（成牛に古い予定が出ないように）。導入前の予定は対象外
function hygDueN(t, h){
  const a = db.animals[t] || {};
  if(!a.birth) return null;
  if(h.sex && a.sex !== h.sex) return null;
  const bn = dn(a.birth);
  if(todayN() - bn > 200) return null;
  const due = h.months ? dn(addMonths(a.birth, h.months)) : bn + h.day;

    const dueN = hygDueN(t, h);

// 種付け（繁殖供用）の目安：和牛は13〜15ヶ月・体重300kg・体高120cm以上、ホルスタインは13ヶ月・体重350kg・体高125cm以上

// 繁殖係の牛：雌で、繁殖の記録があるか、種付け開始月齢に達している
function isBreedingCow(t){

// 子牛係の牛：生まれてから種付け開始前まで（哺乳子牛・育成牛）

// 繁殖の進み具合：0 未受胎（発情待ち）／1 授精待ち／2 鑑定待ち／3 妊娠中

// 発情の時に選んだ方法で、まだ授精（移植）が記録されていない発情を返す
function plannedAI(tag){

function alerts(){
  const S = db.settings, T = todayN(), out = [];
  for(const tag of Object.keys(db.animals)){
    const a = db.animals[tag];
    if(isOut(tag)) continue;
    const push = (left, text, c) => out.push({tag, left, text, c});
    if(a.sex === '雄' && last(tag,'retain') && a.birth){
      const left = dn(addMonths(a.birth, FATTEN_M)) - T;
      if(left <= 60) push(left, left <= 0 ? `${FATTEN_M}ヶ月齢：肉用出荷の時期` : `肉用出荷まで${left}日（${FATTEN_M}ヶ月齢）`, left <= 0 ? 'warn' : 'info');
    }
    if(a.sex === '雌'){
      const pe = plannedAI(tag);
      if(pe){
        const isET = pe.data.method === '受精卵移植';
        const left = dn(pe.date) + (isET ? 7 : 1) - T;
        if(left <= (isET ? 1 : 0) && left >= -3){
          if(isET) push(left, left === 1 ? '明日移植予定（発情から7日）' : left === 0 ? '今日移植です（発情から7日）' : `移植予定を${-left}日過ぎています（発情 ${pe.date}）`, left === 1 ? 'info' : left === 0 ? 'bad' : 'warn');
          else push(left, left === 0 ? '受精してください（発情の翌日）' : `受精予定を${-left}日過ぎています（発情 ${pe.date}）`, left === 0 ? 'bad' : 'warn');
        }
      }
    }
    for(const x of hygStatus(tag)){
      if(x.left < 0) push(x.left, `${x.h.label} 期限超過${-x.left}日`, 'bad');
      else if(x.left <= 1) push(x.left, `${x.h.label}：${x.left === 0 ? '今日' : '明日'}が予定日`, 'info');
    }
    const ts = treatState(tag);
    if(ts && ts.st === '治療中'){
      if(isRecurrent(tag)) push(-ts.days, `再発（30日以内）：治療${ts.days + 1}日目`, 'bad');
      else if(ts.days >= 5) push(-ts.days, `治療${ts.days + 1}日目：治癒の記録を確認`, 'warn');
    }
    if(a.sex === '雌' && !hasRepro(tag) && a.birth && BREED_MIN[a.breed]){
      const age = ageM(a.birth);
      if(age !== null && age >= (S.reproM[a.breed] ?? 13) && !readyInfo(tag).ok)
        push(0, `種付け判定：未達（${readyInfo(tag).txt}）`, 'warn');
      if(age !== null && a.breed === '和牛' && age >= 14)
        push(0, '14ヶ月齢・発情未確認：獣医師に相談', 'bad');
    }
    if(a.sex === '雌' && hasRepro(tag)){
      const r = repro(tag);
      if(r.pregnant){
        const left = dn(r.due) - T;
        if(left >= 60 && left <= 92) push(left, `出荷時期（分娩まで${left}日・2〜3ヶ月前）`, 'info');
        if(left <= S.warnDays) push(left, left < 0 ? `出産予定超過 ${-left}日（予定日 ${r.due}）` : `出産まで${left}日（予定日 ${r.due}）`, left < 0 ? 'bad' : 'warn');
      } else if(r.state === '授精済'){
        const left = dn(r.lastAi.date) + 60 - T;
        if(left <= 7) push(left, left <= 0 ? '妊娠鑑定の時期です' : `妊娠鑑定まで${left}日`, 'info');
      } else if(r.state === '分娩後'){
        const left = dn(r.lastCalv.date) + 60 - T;
        if(left <= 7) push(left, `授精の検討時期（分娩から60日・あと${left}日）`, 'info');
      } else if(r.state === '空胎' || r.state === '繁殖待ち'){
        push(0, `${r.state}：発情・授精の確認`, 'warn');
      }
      continue;
    }
    if(a.birth && !last(tag,'wean')){
      const left = dn(addMonths(a.birth, S.weanM[a.breed] ?? 2)) - T;
      if(left <= S.warnDays && left > -30)
        push(left, left < 0 ? '離乳未記録（予定超過）' : `離乳まで${left}日`, left < 0 ? 'warn' : 'info');
    }
    if(a.birth && a.breed === '和牛' && !hasRepro(tag) && !last(tag,'retain')){
      const sm = S.shipM[a.breed] ?? 10;
      const left = dn(addMonths(a.birth, sm)) - T;
      if(left <= S.warnDays) push(left, left <= 0 ? `${sm}ヶ月齢：出荷か自家保留かを必ず決めてください` : `出荷・保留の判定まで${left}日`, left <= 0 ? 'bad' : 'info');
    }
  }
  return out.sort((x,y) => x.left - y.left);
}

// 父：授精記録から推定した種牛 → その種牛の系統（種牛の設定で登録）
function sireOf(tag){
  const a = db.animals[tag];
  if(!a || !a.mother || !a.birth) return null;
  const ais = evType(a.mother,'ai');
  // 陽性と判定された妊娠鑑定のうち、分娩日に最も近いもの（この妊娠の鑑定）
  const pos = evType(a.mother,'preg').filter(e => e.data.result === '陽性' && e.date <= a.birth)[0];
  if(pos){
    // その鑑定より前の直近の授精が父（直近の種）
    const b = ais.find(e => e.date <= pos.date);
    if(b) return b.data.sire;
  }
  // 鑑定記録がない場合：分娩日より前で、妊娠期間内の直近の授精
  const b = ais.find(e => e.date <= a.birth && dn(a.birth) - dn(e.date) <= 330);
  return b ? b.data.sire : null;
}
// 父系統：種牛の系統を優先。父が不明なら、個体に手入力された系統
function lineOfBull(n){ return n ? (db.sireLine[n] || '') : ''; }
function lineBadge(l){
  if(!l) return '<span class="muted">系統未設定</span>';
  return `<span class="badge" style="background:${LINE_COLOR[l]||'#777'};color:#fff">${esc(l)}</span>`;
}
// 個体の父・祖父・曽祖父（オスの血統）。授精記録があればそれを優先
function malePed(tag, depth=0){
  // [父, 祖父（母の父）, 曽祖父（母の母の父）]
  const a = db.animals[tag] || {}, ped = a.ped || {};
  if(depth > 6) return ['', '', ''];
  const f = sireOf(tag) || ped.f || '';
  // 母牛が登録済みなら、母牛の父（祖父）と母牛の祖父（曽祖父）をそのまま使う
  const dam = a.mother && db.animals[a.mother] ? a.mother : '';
  const dp = dam ? malePed(dam, depth+1) : ['', '', ''];
  const ff = dp[0] || ped.ff || '';
  const fff = dp[1] || ped.fff || '';
  return [f, ff, fff];
}
// 系統：父→祖父→曽祖父の順で、最初に系統が分かっている牛の系統を使う
function fatherLine(tag){
  for(const n of malePed(tag)){ const l = lineOfBull(n); if(l) return l; }
  return '';
}
// 母系統：母牛自身の（父系統ベースの）系統
function motherLine(tag){
  const m = db.animals[tag]?.mother;
  if(!m || !db.animals[m]) return '';
  return fatherLine(m);
}
function bloodlineHTML(tag){
  const ml = db.animals[tag]?.mother ? lineBadge(motherLine(tag)) : '<span class="muted">母：不明</span>';
  return `<div class="muted">父系統 ${lineBadge(fatherLine(tag))} ／ 母系統 ${ml}</div>`;
}

/* ---------- 四代血統 ---------- */
// node: {kind:'cow', id:個体識別番号} | {kind:'bull', id:種牛名} | {kind:'unknown'}
function parentsOf(node){
  const U = {kind:'unknown'};
  if(node.kind === 'cow'){
    const a = db.animals[node.id] || {};
    const s = malePed(node.id)[0];
    const sire = s ? {kind:'bull', id:s} : U;
    const dam = a.mother && db.animals[a.mother] ? {kind:'cow', id:a.mother} : U;
    return [sire, dam];
  }
  if(node.kind === 'bull'){
    const p = db.sirePed[node.id] || {};
    const sire = p.sire ? {kind:'bull', id:p.sire} : U;
    const dam = p.dam && db.animals[p.dam] ? {kind:'cow', id:p.dam} : U;
    return [sire, dam];
  }
  return [U, U];
}
function nodeHTML(n){
  if(n.kind === 'cow') return `<span class="lnk" data-tag="${esc(n.id)}">${esc(n.id)}</span> ${lineBadge(fatherLine(n.id))}`;
  return `${esc(n.id)} ${lineBadge(lineOfBull(n.id))}`;
}
// 四代血統を樹形図で描く（左が本人、右へ父・母と遡る）。不明の先祖は「不明」と表示
// 母系をたどるときは、母の箱をタップすると、その牛の血統図に移れる
function pedigreeHTML(tag){
  const box = (node, label) => {
    if(node.kind === 'unknown') return `<div class="pbox unk"><span class="plab">${esc(label)}</span>不明</div>`;
    if(node.kind === 'cow') return `<div class="pbox cow" data-tag="${esc(node.id)}"><span class="plab">${esc(label)}</span><b>${esc(shortId(node.id))}</b><small>${esc(node.id)}</small>${lineBadge(fatherLine(node.id))}</div>`;
    return `<div class="pbox bull"><span class="plab">${esc(label)}</span><b>${esc(node.id)}</b>${lineBadge(lineOfBull(node.id))}</div>`;
  };
  const walk = (node, g, path, label) => {
    const self = box(node, label);
    if(g >= 4 || node.kind === 'unknown') return `<div class="ptree">${self}</div>`;
    const [s, d] = parentsOf(node);
    const sp = path ? path + 'の父' : '父';
    const dp = path ? path + 'の母' : '母';
    return `<div class="ptree">${self}<div class="pkids">` +
      `<div class="pkid">${walk(s, g+1, sp, sp)}</div>` +
      `<div class="pkid">${walk(d, g+1, dp, dp)}</div>` +
      `</div></div>`;
  };
  return `<div class="pedwrap">${walk({kind:'cow', id:tag}, 0, '', '本人')}</div>` +
    `<div class="muted" style="font-size:12px">横にスクロールできます。母の箱をタップすると、その牛の血統図に移ります。</div>`;
}

  const up = ups.length ? ups.map(link).join(' ← ') : 'なし';
  const kids = children(tag);
  const kidsHtml = kids.length ? kids.map(k => {
    const n = children(k).length, a = db.animals[k];
    const wk = a.breed === '和牛';
    return `<div class="ev"><span>${link(k)} <span class="muted">${esc(a.sex)}・${esc(ageText(a.birth))}${wk ? '・父系統 ' + lineBadge(fatherLine(k)) : ''}${n ? '・子'+n+'頭' : ''}</span></span></div>`;
  }).join('') : '<div class="muted">子牛の記録なし</div>';

function monthsBetween(a, b){
  const A = new Date(a + 'T00:00:00Z'), B = new Date(b + 'T00:00:00Z');
  let m = (B.getUTCFullYear() - A.getUTCFullYear()) * 12 + (B.getUTCMonth() - A.getUTCMonth());
  if(B.getUTCDate() < A.getUTCDate()) m--;
  return m;
}
function evSummary(e){
  const d = e.data || {};
  if(e.type === 'hyg') return (HYG.find(h => h.k === d.k) || {label: d.k}).label;
  if(e.type === 'intro'){
    const an = db.animals[e.tag], am = (an && an.birth) ? monthsBetween(an.birth, e.date) : null;
    return [d.src, d.price ? `買取 ${d.price}千円` : '', am !== null ? `導入時 ${am}ヶ月` : '生年月日未登録'].filter(Boolean).join(' ／ ');
  }
  if(e.type === 'calving' && d.calves){
    return [d.assist, d.count, ...d.calves.map(c => `${c.id} ${c.sex} ${c.breed}`)].filter(Boolean).join(' ／ ');
  }
  return Object.values(d).join(' ／ ');
}

    return f.k === 'sire' ? sel + `<div class="muted" id="sirehint" style="width:100%"></div>` : sel;

  if(f.t === 'text') return `<input id="${id}" placeholder="例 さくら子">`;
  if(f.t === 'num') return `<input id="${id}" type="number" step="0.1" inputmode="decimal" placeholder="例 285">`;
}
function fieldsFor(k, a){
  return TYPES[k].f.filter(f => !f.onlyBreed || (a && f.onlyBreed === a.breed));
}
function reproTypesFor(tag){
  if(!hasRepro(tag)) return ['estrus','ai'];
  const r = repro(tag);
  if(r.pregnant) return ['calving'];
  if(r.state === '授精済') return ['estrus','ai','preg'];
  return ['estrus','ai'];
}
function placeForm(k){
  const btn = document.querySelector(`#typeGrid [data-arg="${k}"]`);
  const ef = $('entryForm');
  if(btn && btn.closest('.grid')) btn.closest('.grid').after(ef);
}
function allowedType(tag, k){
  const a = db.animals[tag]; if(!a) return false;
  if(!roleAllows(k)) return false;
  if(REPRO_TYPES.includes(k)){
    if(a.sex !== '雌') return false;
    if(a.birth && (ageM(a.birth) ?? 0) < (db.settings.reproM[a.breed] ?? 12)) return false;
    if(!reproTypesFor(tag).includes(k)) return false;
  }
  if(k === 'weight' && a.breed === 'ホルスタイン') return false;
  if(k === 'wean' && a.birth){
    const wm = db.settings.weanM[a.breed] ?? 2;
    if((ageM(a.birth) ?? 0) > wm + 3) return false;
  }
  return true;
}
function renderForm(){
  const T = TYPES[selType];
  $('entryForm').innerHTML = `
    <div class="row"><span class="lbl">日付</span><input type="date" id="evDate" value="${todayS()}"></div>
    ${fieldsFor(selType, db.animals[cur]).map(f => `<div class="row ${f.twin?'twin hidden':''} ${f.live?'live':''} ${f.onlyIf?'oif hidden':''}" ${f.onlyIf?`data-oif-k="${f.onlyIf.k}" data-oif-v="${f.onlyIf.v}"`:''}><span class="lbl">${esc(f.label)}</span>${fieldHTML(f)}</div>`).join('')}
    <button class="btn" data-act="record">記録する</button>`;
  $('entryForm').classList.remove('hidden');
}
function recordEvent(){
  if(!cur || !selType) return;
  if(!db.animals[cur] || !allowedType(cur, selType)){ toast('この個体には記録できない項目です'); return; }
  const data = {};
  const twin = $('f_count') && $('f_count').value === '双子';
  for(const f of fieldsFor(selType, db.animals[cur])){
    if(f.twin && !twin) continue;
    if(f.onlyIf && data[f.onlyIf.k] !== f.onlyIf.v) continue;
    if(f.live && data.assist === '死産') continue;
    let v = ($('f_'+f.k)?.value || '').trim();
    if(!v && f.optional){ data[f.k] = ''; continue; }
    if(!v){ toast(f.label + 'を選択・入力してください'); return; }
    if(f.t === 'id' && !ID_RE.test(v)){ toast(f.label + 'は10桁の数字で入力してください'); return; }
    if(f.t === 'num'){ v = Number(v); if(!(v > 0)){ toast(f.label + 'を正しく入力してください'); return; } }
    data[f.k] = v;
  }
  if(selType === 'calving' && data.assist === '死産'){ data.calves = []; }
  else if(selType === 'calving'){
    const calves = [{id:data.c1id, sex:data.c1sex, breed:data.c1breed, name:data.c1name||''}];
    if(twin) calves.push({id:data.c2id, sex:data.c2sex, breed:data.c2breed, name:data.c2name||''});
    const ids = calves.map(c => c.id);
    if(ids.includes(cur)){ toast('母と同じ番号は入力できません'); return; }
    if(new Set(ids).size !== ids.length){ toast('子の番号が重なっています'); return; }
    data.calves = calves;
    delete data.c1id; delete data.c1sex; delete data.c1breed; delete data.c2id; delete data.c2sex; delete data.c2breed; delete data.c1name; delete data.c2name;
  }
  const date = $('evDate').value || todayS();
  if(date > todayS()){ toast('未来の日付は入力できません'); return; }
  const now = new Date().toISOString();
  if(selType === 'calving'){
    for(const c of data.calves){
      if(!db.animals[c.id]){
        db.animals[c.id] = {breed: c.breed, sex: c.sex, birth: date, mother: cur, line: '', name: c.breed === '和牛' ? (c.name || '') : '', createdAt: now};
      } else {
        db.animals[c.id].mother = db.animals[c.id].mother || cur;
        db.animals[c.id].birth = db.animals[c.id].birth || date;
      }
    }
  }
  if(selType === 'ship'){
    const wd = withdrawInfo(cur);
    if(wd) toast(`警告：休薬中です（${wd.drug}・${mdOf(wd.end)}まで）`);
  }
  db.events.push({id: uid(), tag: cur, type: selType, date, data, createdAt: now});
  save();
  openTag(cur); markType(); renderForm();
  toast('記録しました');
}

function saveAnimal(){

  if(birth && birth > todayS()){ $('regMsg').textContent = '生年月日に未来の日付は入れられません'; return; }

  const prev = db.animals[tag] || {createdAt: new Date().toISOString()};

function delAnimal(tag){
  delete db.animals[tag];

  Object.values(db.animals).forEach(a => { if(a.mother === tag) a.mother = ''; });
  save(); cur = null; $('tagIn').value = '';

/* ---------- 一覧・アラート ---------- */
const BREED_COLOR = {'和牛':'#111827','ホルスタイン':'#ea580c','F1':'#9ca3af','その他':'#ffffff'};
// 状態の絞り込み：画面（哺乳・育成・和牛/ホルスタインの繁殖）ごとに、必要なものだけ出す
function nursePhase(t){
  const a = db.animals[t] || {};
  if(!a.birth) return '';
  const wd = dn(addMonths(a.birth, db.settings.weanM[a.breed] ?? 2)), T = todayN();
  return T < wd - 14 ? '通常哺乳' : T < wd - 7 ? '減乳期間①' : T < wd ? '減乳期間②' : '離乳';
}
const CHIP = {
  '全て': () => true,
  '治療中': t => (treatState(t) || {}).st === '治療中',
  '経過観察': t => (treatState(t) || {}).st === '経過観察',
  '通常哺乳': t => isNursing(t) && nursePhase(t) === '通常哺乳',
  '減乳期間①': t => isNursing(t) && nursePhase(t) === '減乳期間①',
  '減乳期間②': t => isNursing(t) && nursePhase(t) === '減乳期間②',
  '未受胎': t => isBreedingCow(t) && stageOf(t).idx <= 1,
  '鑑定待ち': t => isBreedingCow(t) && stageOf(t).idx === 2,
  '妊娠中': t => isBreedingCow(t) && stageOf(t).idx === 3,
  '出産直前': t => statuses(t).some(s => s.t === '出産直前'),
  '出産予定超過': t => statuses(t).some(s => s.t === '出産予定超過'),
  '出荷・保留未決定': t => statuses(t).some(s => s.t === '出荷・保留の判定（未決定）'),
};
function chipsFor(){
  if(breedF === '哺乳中') return ['全て','治療中','経過観察','通常哺乳','減乳期間①','減乳期間②'];
  if(breedF === '育成') return ['全て','治療中','出荷・保留未決定'];
  if(breedF === '和牛') return ['全て','未受胎','鑑定待ち','妊娠中','出産直前','出産予定超過','治療中','出荷・保留未決定'];
  if(breedF === 'ホルスタイン') return ['全て','未受胎','鑑定待ち','妊娠中','出産直前','出産予定超過','治療中'];
  return FILTERS;
}
function chipTest(f, t){
  return (CHIP[f] || (() => statuses(t).some(s => s.t === f)))(t);
}
// 哺乳・育成の絞り込み（育成は品種で和牛／ホルスタインを分ける）
function matchBreedF(t){
  const a = db.animals[t] || {};
  if(breedF === '哺乳中') return isCalfRole(t) && isNursing(t);
  if(breedF === '育成') return isCalfRole(t) && !isNursing(t) && (rearF === '全て' || a.breed === rearF);
  return a.breed === breedF;
}
// 並べ替え：番号順／月齢が若い順／月齢が高い順（哺乳・育成のとき）
function sortCmp(a, b){
  if(breedF === '哺乳中'){
    const rk = t => { const st = (treatState(t) || {}).st; return st === '治療中' ? 0 : st === '経過観察' ? 1 : hygStatus(t).some(x => x.left < 0) ? 2 : 3; };
    const d = rk(a) - rk(b); if(d) return d;
  }
  const isCalf = breedF === '哺乳中' || breedF === '育成';
  const k = t => (db.animals[t] || {}).birth || '';
  if(isCalf && sortMode === 'young') return k(b).localeCompare(k(a)) || natSort(a, b);
  if(isCalf && sortMode === 'old') return (k(a) || '9').localeCompare(k(b) || '9') || natSort(a, b);
  return natSort(a, b);
}

  const section = (title, arr, id) => `<div ${id ? `id="${id}"` : ''} class="muted" style="margin:12px 0 6px;font-weight:bold;scroll-margin-top:12px">${title}（${arr.length}頭）</div>` + (arr.length ? arr.map(listItem).join('') : '<div class="muted">なし</div>');

  let rows, head = '';
  if(breedF === '和牛' || breedF === 'ホルスタイン'){

    const n0 = br.filter(t => idxOf(t) <= 1), n2 = br.filter(t => idxOf(t) === 2), n3 = br.filter(t => idxOf(t) === 3);
    const tile = (label, n, cls, jump) => `<div class="tile ${cls}" data-jump="${jump}" style="cursor:pointer"><div style="font-size:26px;font-weight:bold">${n}</div><div style="font-size:13px">${label}</div></div>`;
    head = `<div class="tiles">${tile('未受胎', n0.length, 't-warn', 'sec-n0')}${tile('鑑定待ち', n2.length, 't-info', 'sec-n2')}${tile('妊娠中', n3.length, 't-calm', 'sec-n3')}</div>`;
    rows = section('未受胎（受胎を最優先）', n0, 'sec-n0') + section('授精済・鑑定待ち', n2, 'sec-n2') + section('妊娠中', n3, 'sec-n3') +
      section(breedF === '和牛' ? 'その他の和牛' : 'その他のホルスタイン', other, 'sec-other');

  }
  $('listBox').innerHTML = head + tool + toggle + rows;

function importJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();

}
function importJSONText(text){
  try{
    const d = JSON.parse(text);
    Object.assign(db.animals, d.animals || {});
    Object.assign(db.sireLine, d.sireLine || {});
    Object.assign(db.sirePed, d.sirePed || {});
    Object.entries(d.masters || {}).forEach(([m,l]) => { db.masters[m] = [...new Set([...(db.masters[m]||[]), ...l])]; });
    const ids = new Set(db.events.map(e => e.id));
    (d.events || []).forEach(e => { if(!ids.has(e.id)) db.events.push(e); });
    save(); show('set'); toast('読み込みました');
  }catch(e){ toast('読み込みに失敗しました（文字が不正です）'); }
}

/* ---------- スプレッドシート同期 ---------- */
const SYNC_KEY = 'cattle-sync-url';
let syncReady = false, syncing = false, pushAgain = false, syncTimer = null, syncMsg = '';
function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function lsSet(k,v){ try { localStorage.setItem(k, v); } catch(e){} }
function persistLocal(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
function syncURL(){ return lsGet(SYNC_KEY); }
function setSyncStatus(t){ syncMsg = t; const el = $('syncStatus'); if(el) el.textContent = t; }
function nowStr(){ return new Date().toLocaleTimeString('ja-JP', {hour:'2-digit', minute:'2-digit'}); }
function stateOnly(){ return {animals: db.animals, events: db.events, masters: db.masters, settings: db.settings, sireLine: db.sireLine, sirePed: db.sirePed}; }
function hasData(x){ return Object.keys(x.animals).length > 0 || x.events.length > 0; }
function mergeInto(base, add){
  Object.entries(add.animals || {}).forEach(([t,a]) => { if(!base.animals[t]) base.animals[t] = a; });
  const ids = new Set(base.events.map(e => e.id));
  (add.events || []).forEach(e => { if(!ids.has(e.id)) base.events.push(e); });
  Object.entries(add.masters || {}).forEach(([m,l]) => { base.masters[m] = [...new Set([...(base.masters[m] || []), ...l])]; });
  Object.entries(add.sireLine || {}).forEach(([k,v]) => { if(!base.sireLine[k]) base.sireLine[k] = v; });
  Object.entries(add.sirePed || {}).forEach(([k,v]) => { base.sirePed[k] = {...v, ...(base.sirePed[k] || {})}; });
  return base;
}
function refreshView(){
  const v = ['input','alerts','list','set'].find(x => !$('v-'+x).classList.contains('hidden'));
  if(v) show(v); else updateBadge();
}
function scheduleSync(){
  if(!syncURL() || !syncReady) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(pushSync, 800);
}
function jsonp(url){
  return new Promise((resolve, reject) => {
    const name = 'cbs' + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 20000);
    function cleanup(){ clearTimeout(timer); try { delete window[name]; } catch(e){} s.remove(); }
    window[name] = (data) => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error('network')); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'action=get&callback=' + name + '&t=' + Date.now();
    document.head.appendChild(s);
  });
}
function postForm(url, obj){
  return new Promise((resolve) => {
    let fr = document.getElementById('syncframe');
    if(!fr){
      fr = document.createElement('iframe');
      fr.id = 'syncframe'; fr.name = 'syncframe';
      fr.style.display = 'none';
      document.body.appendChild(fr);
    }
    const f = document.createElement('form');
    f.method = 'POST'; f.action = url; f.target = 'syncframe';
    f.style.display = 'none';
    const i = document.createElement('input');
    i.type = 'hidden'; i.name = 'payload'; i.value = JSON.stringify(obj);
    f.appendChild(i);
    document.body.appendChild(f);
    f.submit();
    setTimeout(() => { f.remove(); resolve(); }, 1500);
  });
}
async function pushSync(){
  const url = syncURL();
  if(!url || !syncReady) return;
  if(syncing){ pushAgain = true; return; }
  syncing = true;
  const sent = db.updatedAt || 0;
  setSyncStatus('保存しています…');
  try{
    await postForm(url, {updatedAt: sent, data: stateOnly()});
    let j = {updatedAt: 0};
    for(let i = 0; i < 6; i++){
      await new Promise(r => setTimeout(r, 3000));
      j = await jsonp(url);
      if((j.updatedAt || 0) >= sent) break;
    }
    if((j.updatedAt || 0) === sent){
      if(db.updatedAt === sent) lsSet('cattle-dirty','');
      lsSet('cattle-synced','1');
      setSyncStatus('同期済み（' + nowStr() + '）');
    } else if((j.updatedAt || 0) > sent){
      syncing = false; return pullSync();
    } else {
      setSyncStatus('保存を確認できませんでした。もう一度「今すぐ同期」を押してください');
    }
  }catch(e){
    setSyncStatus('通信できないため、この端末に保存しています。つながると自動で同期します');
  }finally{
    syncing = false;
    if(pushAgain){ pushAgain = false; scheduleSync(); }
  }
}
async function pullSync(){
  const url = syncURL();
  if(!url) return;
  setSyncStatus('同期しています…');
  try{
    const j = await jsonp(url);
    if(j.error) throw new Error(j.error);
    syncReady = true;
    const remote = j.updatedAt || 0, local = db.updatedAt || 0, rdata = j.data || {};
    const needMerge = !!lsGet('cattle-dirty') || (!lsGet('cattle-synced') && hasData(db));
    if(remote && needMerge){
      db = mergeInto(build(rdata), db); db.updatedAt = Date.now(); persistLocal();
      await pushSync();
    } else if(!remote){
      if(hasData(db)){ db.updatedAt = Date.now(); persistLocal(); await pushSync(); }
      else setSyncStatus('接続しました（まだデータはありません）');
    } else if(remote > local){
      db = build(rdata); db.updatedAt = remote; persistLocal(); lsSet('cattle-synced','1');
      setSyncStatus('最新のデータを読み込みました（' + nowStr() + '）');
      refreshView();
    } else if(local > remote){
      await pushSync();
    } else {
      lsSet('cattle-synced','1');
      setSyncStatus('同期済み（' + nowStr() + '）');
    }
  }catch(e){
    setSyncStatus('通信できないため、この端末に保存しています。つながると自動で同期します');
  }
}
window.addEventListener('online', () => pullSync());
document.addEventListener('visibilitychange', () => { if(!document.hidden) pullSync(); });

/* ---------- 操作の受付 ---------- */
const ACT = {
  show: v => show(v),
  newReg: () => { renderReg(null); show('reg'); },
  regNew: t => { renderReg(null); $('rTag').value = t; show('reg'); },
  editAnimal: t => { renderReg(t); show('reg'); },
  saveAnimal: () => saveAnimal(),
  delAnimal: t => delAnimal(t),
  pick: k => { selType = k; renderForm(); markType(); placeForm(k); },
  record: () => recordEvent(),
  delEv: id => { db.events = db.events.filter(e => e.id !== id); save(); openTag(cur); toast('削除しました'); },
  filter: f => { filterSt = f; renderList(); },
  saveSettings: () => saveSettings(),
  saveSyncUrl: () => {
    const u = ($('syncUrl').value || '').trim();
    lsSet(SYNC_KEY, u);
    if(!u){ syncReady = false; setSyncStatus('未接続（この端末だけに保存されています）'); toast('接続を解除しました'); return; }
    syncReady = false; toast('接続しました'); pullSync();
  },
  syncNow: () => pullSync(),
  toggleOut: () => { showOut = !showOut; renderList(); },
  clearAnimals: () => {
    db.animals = {}; db.events = [];
    save(); show('set'); toast('牛の情報を消しました');
  },
  breedf: b => setBreed(b),
  toggleMulti: arg => {
    const i = arg.indexOf('|'), hid = arg.slice(0, i), name = arg.slice(i + 1);
    const set = new Set(($(hid).value || '').split('、').filter(Boolean));
    if(set.has(name)) set.delete(name); else set.add(name);
    $(hid).value = [...set].join('、');
    document.querySelectorAll(`[data-multi="${hid}"]`).forEach(b => b.classList.toggle('on', set.has(b.dataset.name)));
  },
  allList: () => { breedF = '全て'; show('list'); },
  breedTab: b => { breedF = b; show('list'); },
  setRole: r => setRole(r),
  hygAsk: k => { hygAsk = k; openTag(cur); },
  hygCancel: () => { hygAsk = null; openTag(cur); },
  hygDone: k => {
    if(!cur) return;
    hygAsk = null;
    db.events.push({id: uid(), tag: cur, type: 'hyg', date: todayS(), data: {k}, createdAt: new Date().toISOString()});
    save(); openTag(cur);
    toast('衛生管理を記録しました');
  },
  repeatTreat: () => {
    if(!cur) return;
    const prev = evType(cur,'inj')[0];
    if(!prev){ toast('前回の処置がありません'); return; }
    db.events.push({id: uid(), tag: cur, type: 'inj', date: todayS(), data: {...(prev.data || {})}, createdAt: new Date().toISOString()});
    save(); openTag(cur);
    toast(`前回と同じ処置（${(prev.data || {}).drug || ''}）を記録しました`);
  },
  cureNow: () => {
    if(!cur) return;
    db.events.push({id: uid(), tag: cur, type: 'cured', date: todayS(), data: {}, createdAt: new Date().toISOString()});
    save(); openTag(cur);
    toast('治癒にしました。7日間は経過観察になります');
  },
  rearf: v => { rearF = v; renderList(); },
  importPaste: () => { const t = ($('jsonTxt').value || '').trim(); if(!t){ toast('文字を貼り付けてください'); return; } importJSONText(t); },
  openAddMaster: m => $('addm_'+m).classList.toggle('hidden'),
  confirmMaster: m => {
    const n = ($('nm_'+m).value || '').trim();
    if(!n){ toast('名称を入力してください'); return; }
    if(!db.masters[m].includes(n)){ db.masters[m].push(n); save(); }
    renderSettings(); toast(`「${n}」を追加しました`);
  },
  confirmAdd: arg => {
    const [m, id] = arg.split('|');
    const sel = $(id), n = ($('nm_'+id).value || '').trim();
    if(!n){ toast('名称を入力してください'); return; }
    if(!db.masters[m].includes(n)){ db.masters[m].push(n); save(); }
    if(![...sel.options].some(o => o.value === n)) sel.insertBefore(new Option(n,n), sel.querySelector('option[value="__add__"]'));
    sel.value = n;
    const row = sel.closest('.row').nextElementSibling;
    if(row && row.classList.contains('addrow')) row.remove();
    if(id === 'f_sire') $('sirehint').textContent = db.sireLine[n] ? `系統：${db.sireLine[n]}` : '系統未設定（設定画面で登録）';
    toast(`「${n}」を追加して選択しました`);
  },
  delMaster: arg => {
    const [m,i] = arg.split('|');
    const removed = db.masters[m][Number(i)];
    db.masters[m].splice(Number(i),1);
    if(m === 'sire') delete db.sireLine[removed];
    save(); renderSettings(); toast('削除しました');
  },
  json: () => exportJSON(),
  csvEv: () => exportEvCSV(),
  csvAn: () => exportAnCSV(),
  pasteImport: () => {
    const lines = ($('pasteTxt').value || '').split(/\n/).map(s => s.trim()).filter(Boolean);
    let ok = 0; const skip = [], bad = [];
    for(const ln of lines){
      const [id, b, sex, breed] = ln.split(/[\s,、]+/);
      let birth = b || '';
      if(/^\d{1,2}\.\d{1,2}$/.test(birth)){
        const [mm, dd] = birth.split('.');
        birth = `${todayS().slice(0,4)}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
      }
      if(!ID_RE.test(id || '') || !/^\d{4}-\d{2}-\d{2}$/.test(birth) || birth > todayS() || !SEX.includes(sex) || !BREEDS.includes(breed)){
        bad.push(ln); continue;
      }
      if(db.animals[id]){ skip.push(id); continue; }
      db.animals[id] = {breed, sex, birth, mother: '', ped: {}, createdAt: new Date().toISOString()};
      ok++;
    }
    save();
    let msg = `${ok}頭を登録しました`;
    if(skip.length) msg += `。登録済みのため飛ばした：${skip.join('、')}`;
    if(bad.length) msg += `。読めなかった行：${bad.join(' ／ ')}`;
    $('pasteMsg').textContent = msg;
    if(ok) $('pasteTxt').value = '';
  },
  copyEx: () => {
    const t = $('exTxt'); t.focus(); t.select();
    try { navigator.clipboard.writeText(t.value).then(() => toast('コピーしました'), () => toast('選択した文字をコピーしてください')); }
    catch(e) { toast('選択した文字をコピーしてください'); }
  },
};

// 「もう一度押すと確定」方式（ダイアログを使わない）
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(b){
    if(b.hasAttribute('data-confirm') && !b.dataset.armed){
      b.dataset.armed = '1';
      b.dataset.orig = b.textContent;
      b.textContent = b.classList.contains('xbtn') ? '確定' : 'もう一度押すと削除';
      b.style.background = '#b33a3a'; b.style.color = '#fff';
      setTimeout(() => {
        if(b.isConnected && b.dataset.armed){
          delete b.dataset.armed; b.textContent = b.dataset.orig; b.style.background = ''; b.style.color = '';
        }
      }, 3000);
      return;
    }
    ACT[b.dataset.act]?.(b.dataset.arg);
    return;
  }
  const jump = e.target.closest('[data-jump]');
  if(jump){ document.getElementById(jump.dataset.jump)?.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  const t = e.target.closest('[data-tag]');
  if(t){ show('input'); openTag(t.dataset.tag); }
});

document.addEventListener('change', e => {
  if(e.target.id === 'sortSel'){ sortMode = e.target.value; renderList(); return; }
  if(e.target.id === 'f_assist'){ document.querySelectorAll('.live').forEach(r => r.classList.toggle('hidden', e.target.value === '死産')); }
  if(e.target.id && e.target.id.startsWith('f_')){
    const k = e.target.id.slice(2);
    document.querySelectorAll('.oif').forEach(r => { if(r.dataset.oifK === k) r.classList.toggle('hidden', e.target.value !== r.dataset.oifV); });
  }
  if(e.target.id === 'rBreed'){ $('pedBox').classList.toggle('hidden', e.target.value !== '和牛'); $('otherBox').classList.toggle('hidden', e.target.value !== 'その他'); $('nameBox').classList.toggle('hidden', e.target.value !== '和牛'); }
  const s = e.target;
  if(s.tagName !== 'SELECT') return;
  // 種牛の系統の設定
  if(s.dataset.sireline !== undefined){
    db.sireLine[s.dataset.sireline] = s.value;
    save(); toast('系統を保存しました。関連する血統も自動で更新されます');
    return;
  }
  const row = s.closest('.row');
  const next = row && row.nextElementSibling;
  if(next && next.classList.contains('addrow')) next.remove();
  if(s.dataset.sp){
    const name = s.dataset.name;
    db.sirePed[name] = db.sirePed[name] || {};
    db.sirePed[name][s.dataset.sp] = s.value;
    save(); toast('血統を保存しました');
    return;
  }
  if(s.id === 'f_count'){
    document.querySelectorAll('.twin').forEach(r => r.classList.toggle('hidden', s.value !== '双子'));
  }
  // 授精の種牛を選んだら、その系統を表示
  if(s.id === 'f_sire'){
    const h = $('sirehint');
    if(h) h.textContent = s.value && s.value !== '__add__' ? (db.sireLine[s.value] ? `系統：${db.sireLine[s.value]}` : '系統未設定（設定画面で登録）') : '';
  }
  if(s.value !== '__add__') return;
  const m = s.dataset.m;
  const addRow = document.createElement('div');
  addRow.className = 'row addrow';
  addRow.innerHTML = `<input id="nm_${s.id}" placeholder="新しい名称を入力">
    <button class="btn btnsmall" data-act="confirmAdd" data-arg="${m}|${s.id}">追加</button>`;
  row.insertAdjacentElement('afterend', addRow);
  $('nm_'+s.id).focus();
});

renderReg(null);
show(loadView());
pullSync();
</script>
